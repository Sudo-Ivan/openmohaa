name: "Publish Release"

on:
  workflow_dispatch:
  push:
    tags:
        - "v*.*.*"

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  RELEASE_STAGE: ${{ vars.RELEASE_STAGE || 'unstable' }}
  RELEASE_IS_PRERELEASE: ${{ vars.RELEASE_IS_PRELEASE }}

permissions:
  contents: write

jobs:
  build-all:
   uses: ./.github/workflows/shared-build.yml
   with:
      environment: "release"

  create-release:
    runs-on: ubuntu-24.04
    environment: 'release'
    needs: [build-all]

    steps:
    - name: Release
      uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
      with:
        name: '${{github.ref_name}}-${{env.RELEASE_STAGE}}'
        prerelease: ${{env.RELEASE_IS_PRERELEASE}}
        allowUpdates: true

  deploy-all:
    runs-on: ubuntu-24.04
    environment: 'release'
    needs: [create-release]

    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: 'out-*'
        path: artifacts

    - name: Zip regular artifacts
      run: |
        for dir in artifacts/out-*; do
          [[ "$dir" != *-installer ]] || continue
          target="${dir#artifacts/out-}"
          (cd "$dir" && zip -9 -r "$GITHUB_WORKSPACE/${{ github.event.repository.name }}-${{github.ref_name}}-${target}.zip" .)
        done

    - name: Collect installers
      run: |
        for dir in artifacts/out-*-installer; do
          [ -d "$dir" ] || continue
          target="${dir#artifacts/out-}"
          target="${target%-installer}"
          cp "$dir/Setup.msi" "$GITHUB_WORKSPACE/${{ github.event.repository.name }}-${{github.ref_name}}-${target}.msi"
        done

    - name: Release
      uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
      with:
        files: |
          ${{github.workspace}}/*.zip
          ${{github.workspace}}/*.msi
