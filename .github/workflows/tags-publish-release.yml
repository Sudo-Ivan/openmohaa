name: "Publish Release"

on:
  push:
    tags:
        - "v*.*.*"
  workflow_dispatch:

env:
  RELEASE_STAGE: ${{ vars.RELEASE_STAGE || 'unstable' }}
  RELEASE_IS_PRERELEASE: ${{ vars.RELEASE_IS_PRELEASE }}

permissions:
  contents: read

jobs:
  build-all:
   uses: ./.github/workflows/shared-build.yml
   permissions:
     contents: read
   with:
      environment: "release"

  # Initially create a release with 1 job
  # so multiple files can be uploaded at the same time afterwards
  create-release:
    runs-on: ubuntu-24.04
    environment: 'release'
    needs: [build-all]
    permissions:
      contents: write

    steps:
    - name: Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        name: '${{github.ref_name}}-${{env.RELEASE_STAGE}}'
        prerelease: ${{env.RELEASE_IS_PRERELEASE}}

  deploy-all:
    strategy:
      matrix:
        target_os: [
          'linux-amd64',
          'linux-i686',
          'linux-arm64',
          'linux-armhf',
          'linux-powerpc',
          'linux-ppc64',
          'linux-ppc64el',
          'windows-x64',
          'windows-x64-pdb',
          'windows-x86',
          'windows-x86-pdb',
          'windows-arm64',
          'windows-arm64-pdb',
        ]

    runs-on: ubuntu-24.04
    environment: 'release'
    needs: [create-release]
    permissions:
      contents: write

    env:
      RELEASE_NAME: ${{ github.event.repository.name }}-${{github.ref_name}}-${{matrix.target_os}}

    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: 'out-${{matrix.target_os}}'
        path: ${{github.workspace}}/${{matrix.target_os}}

    - name: Zip
      working-directory: '${{github.workspace}}/${{matrix.target_os}}'
      run: zip -9 -r "../${{ env.RELEASE_NAME }}.zip" ./

    - name: Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        files: ${{github.workspace}}/${{ env.RELEASE_NAME }}.zip

  deploy_installer_windows:
    strategy:
      matrix:
        target_os: [
          'windows-x64',
          'windows-x86',
          'windows-arm64',
        ]
    
    runs-on: ubuntu-24.04
    environment: "release"
    needs: [create-release]
    permissions:
      contents: write

    env:
      RELEASE_NAME: ${{ github.event.repository.name }}-${{github.ref_name}}-${{matrix.target_os}}

    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: 'out-${{matrix.target_os}}-installer'
        path: ${{github.workspace}}/${{matrix.target_os}}

    - name: Setup
      working-directory: '${{github.workspace}}/${{matrix.target_os}}'
      run:
        cp Setup.msi ../${{ env.RELEASE_NAME }}.msi

    - name: Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        files: ${{github.workspace}}/${{ env.RELEASE_NAME }}.msi
