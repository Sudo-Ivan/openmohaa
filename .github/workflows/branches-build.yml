name: "Builds"

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-all:
   uses: ./.github/workflows/shared-build.yml
   with:
      environment: 'testing'

  create-release:
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    environment: 'testing'
    needs: [build-all]

    steps:
    - name: Release
      uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
      with:
        prerelease: true
        name: 'dev-${{github.sha}}'
        tag_name: 'dev-${{github.sha}}'

  deploy-release:
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    environment: 'testing'
    needs: [create-release]

    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: 'out-*'
        path: artifacts

    - name: Zip artifacts
      run: |
        for dir in artifacts/out-*; do
          target="${dir#artifacts/out-}"
          (cd "$dir" && zip -9 -r "$GITHUB_WORKSPACE/${{ github.event.repository.name }}-dev-${target}.zip" .)
        done

    - name: Release
      uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
      with:
        tag_name: 'dev-${{github.sha}}'
        files: ${{github.workspace}}/*.zip
